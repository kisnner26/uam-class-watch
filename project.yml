name: UAMClassWatch
options:
  bundleIdPrefix: com.kisito
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  UAMClassWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared/ScheduleModels.swift
      - path: UAMClassWatch

    info:
      path: Generated/WatchInfo.plist
      properties:
        CFBundleDisplayName: "UAM Class"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: com.kisito.uamclass.ios
        UISupportedInterfaceOrientations: ["UIInterfaceOrientationPortrait"]
        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kisito.uamclass.ios.watchkitapp
        PRODUCT_NAME: "UAM Class"
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        # pon tu Team ID de Apple Developer aquí (o elígelo en Xcode > Signing)
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: NO
        TARGETED_DEVICE_FAMILY: "4"
